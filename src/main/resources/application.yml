spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chitralekha?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:vishnu}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  application:
    name: chitra-lekha

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    org.flywaydb: INFO
    com.chitralekha: DEBUG

app:
  frontend:
    url: http://localhost:5173
  tmdb:
    api-key: ${TMDB_API_KEY:}
  google-books:
    api-key: ${GOOGLE_BOOKS_API_KEY:}
